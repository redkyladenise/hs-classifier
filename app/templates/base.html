<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HS Classifier{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Navigation Bar -->

    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: var(--color-primary);">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">HS Classifier</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link {% if request.path == '/' %}active fw-bold{% endif %}" href="/">Classifier</a>
                    <a class="nav-link {% if request.path == '/about' %}active fw-bold{% endif %}" href="/about">About</a>
                    <a class="nav-link {% if request.path == '/guide' %}active fw-bold{% endif %}" href="/guide">Help</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Block -->
    <main id="main-content" class="py-4 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="text-center py-4">
        <p class="mb-1">
            Data Sources: 
            <a href="https://customs.gov.ph" target="_blank" rel="noopener noreferrer" style="color: var(--color-primary);">Bureau of Customs</a>, 
            <a href="https://data.bettergov.ph/datasets/21" target="_blank" rel="noopener noreferrer" style="color: var(--color-primary);">BetterGov.ph</a>
        </p>        
        <p class="mb-0">Assistive tool, not an official classification.</p>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>

    {% block scripts %}{% endblock %}
</body>
</body>
</html>
